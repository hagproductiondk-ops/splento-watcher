name: Splento Denmark watcher

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes (GitHub may delay runs a few minutes)
  workflow_dispatch:
    inputs:
      test_message:
        description: "Only send a Telegram test message"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: splento-watcher
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check Splento
        env:
          SPLENTO_USERNAME: ${{ secrets.SPLENTO_USERNAME }}
          SPLENTO_PASSWORD: ${{ secrets.SPLENTO_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ inputs.test_message }}" = "true" ]; then
            python watcher.py --test-message
          else
            python watcher.py
          fi

      - name: Save which jobs were already sent
        if: ${{ !inputs.test_message }}
        run: |
          git config user.name "splento-watcher"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || { git commit -m "Update seen sessions" && git push; }
